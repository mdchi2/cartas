<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CARTAS COLECCIONABLES</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0c0f17;
            --bg-card: #151b28;
            --border-card: #253046;
            --accent-gold: #f59e0b;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at top, #182236 0%, var(--bg-main) 70%);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            padding-bottom: 70px;
        }

        /* HEADER RESPONSIVO */
        header {
            padding: 16px 20px;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.95) 0%, rgba(12, 15, 23, 0.85) 100%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: sticky;
            top: 0;
            backdrop-filter: blur(14px);
            z-index: 50;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .header-text {
            text-align: left;
        }

        .header-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(1.8rem, 5vw, 3.2rem);
            letter-spacing: 1.5px;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 50%, #f43f5e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 25px rgba(245, 158, 11, 0.25);
            line-height: 1;
        }

        .header-subtitle {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 3px;
        }

        /* BOTÓN DE CARRITO EN HEADER */
        .btn-cart-toggle {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #fff;
            border: 1px solid #3b82f6;
            padding: 9px 15px;
            border-radius: 999px;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
            transition: all 0.2s ease;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .btn-cart-toggle:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(37, 99, 235, 0.5);
        }

        .cart-badge {
            background: #ef4444;
            color: #fff;
            font-size: 0.72rem;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 999px;
        }

        /* CONTROLES Y FILTROS */
        .controls-container {
            max-width: 1200px;
            margin: 18px auto 8px;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        @media (min-width: 768px) {
            .controls-container {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                padding: 0 20px;
            }
        }

        .filter-buttons {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .filter-buttons::-webkit-scrollbar {
            display: none;
        }

        .btn-filter {
            background: #1e293b;
            color: var(--text-muted);
            border: 1px solid var(--border-card);
            padding: 7px 14px;
            border-radius: 999px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            transition: all 0.2s ease;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .btn-filter.active {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            border-color: #60a5fa;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        @media (min-width: 768px) {
            .search-box {
                max-width: 260px;
            }
        }

        .search-box input {
            width: 100%;
            background: #111827;
            border: 1px solid var(--border-card);
            border-radius: 999px;
            padding: 8px 16px 8px 36px;
            color: #fff;
            font-family: inherit;
            font-size: 0.88rem;
            outline: none;
            transition: border 0.2s;
        }

        .search-box input:focus {
            border-color: var(--accent-blue);
        }

        .search-box svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            fill: var(--text-muted);
        }

        .stats-bar {
            max-width: 1200px;
            margin: 6px auto 18px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        @media (min-width: 768px) {
            .stats-bar {
                padding: 0 20px;
                justify-content: flex-start;
                gap: 20px;
            }
        }

        .stat-item strong {
            color: #f1f5f9;
        }

        /* GRID DE CARTAS - ADAPTADO CELULAR Y PC */
        .cards-grid {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 12px;
            display: grid;
            /* Celulares: 2 columnas */
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        /* Tablets chicas: 3 columnas */
        @media (min-width: 540px) {
            .cards-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 16px;
                padding: 0 16px;
            }
        }

        /* Tablets / Laptops: 4 columnas */
        @media (min-width: 820px) {
            .cards-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 20px;
                padding: 0 20px;
            }
        }

        /* PC Escritorio: 5 columnas */
        @media (min-width: 1080px) {
            .cards-grid {
                grid-template-columns: repeat(5, 1fr);
                gap: 24px;
            }
        }

        /* CADA TARJETA DE CARTA */
        .sticker-card {
            background: var(--bg-card);
            border-radius: 14px;
            border: 1px solid var(--border-card);
            padding: 8px;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            position: relative;
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s, border-color 0.2s;
            overflow: hidden;
        }

        @media (min-width: 768px) {
            .sticker-card {
                padding: 10px;
                border-radius: 16px;
            }
            .sticker-card:hover {
                transform: translateY(-5px);
                box-shadow: 0 14px 26px rgba(0, 0, 0, 0.5), 0 0 20px rgba(59, 130, 246, 0.2);
                border-color: rgba(96, 165, 250, 0.5);
            }
        }

        .sticker-card.in-cart {
            border-color: rgba(16, 185, 129, 0.5);
        }

        .in-cart-indicator {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(16, 185, 129, 0.95);
            color: #fff;
            font-size: 0.64rem;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 5px;
            z-index: 10;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
            display: none;
        }

        .sticker-card.in-cart .in-cart-indicator {
            display: block;
        }

        /* CONTENEDOR DE IMAGEN */
        .crop-viewport {
            width: 100%;
            aspect-ratio: 245 / 325;
            border-radius: 8px;
            overflow: hidden;
            background-color: #0b0e14;
            position: relative;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .crop-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.25s ease;
        }

        /* DETALLES DE LA CARTA */
        .card-info {
            padding: 8px 2px 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-number {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.25rem;
            letter-spacing: 0.5px;
            color: #fff;
        }

        .card-sheet {
            font-size: 0.68rem;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }

        /* BOTON AGREGAR $ 500 */
        .btn-add-cart {
            margin-top: 6px;
            width: 100%;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            border: 1px solid #3b82f6;
            color: #fff;
            padding: 8px 6px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .btn-add-cart:active {
            transform: scale(0.97);
        }

        .btn-add-cart .price-tag {
            background: rgba(255, 255, 255, 0.2);
            padding: 1px 5px;
            border-radius: 4px;
            font-weight: 800;
            font-size: 0.78rem;
        }

        /* ================================================= */
        /* PANEL LATERAL DE CARRITO (DRAWER RESPONSIVO)       */
        /* ================================================= */
        .cart-overlay {
            position: fixed;
            inset: 0;
            background: rgba(4, 7, 13, 0.8);
            backdrop-filter: blur(8px);
            z-index: 120;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .cart-overlay.active {
            display: block;
            opacity: 1;
        }

        .cart-drawer {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            max-width: 440px;
            height: 100%;
            background: #121824;
            border-left: 1px solid var(--border-card);
            box-shadow: -15px 0 35px rgba(0,0,0,0.7);
            z-index: 130;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .cart-drawer.active {
            transform: translateX(0);
        }

        .cart-header {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-card);
            background: rgba(255, 255, 255, 0.02);
        }

        .cart-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.6rem;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-close-cart {
            background: rgba(255, 255, 255, 0.06);
            border: none;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.4rem;
            cursor: pointer;
            display: grid;
            place-items: center;
        }

        .cart-items-container {
            flex: 1;
            overflow-y: auto;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .cart-empty-message {
            text-align: center;
            color: var(--text-muted);
            margin: auto 0;
            padding: 40px 16px;
        }

        .cart-empty-icon {
            font-size: 3rem;
            margin-bottom: 10px;
            opacity: 0.5;
        }

        /* ITEM EN EL CARRITO */
        .cart-item {
            background: #172030;
            border: 1px solid var(--border-card);
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cart-item-thumb {
            width: 46px;
            height: 64px;
            border-radius: 6px;
            overflow: hidden;
            background: #000;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .cart-item-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cart-item-info {
            flex: 1;
            min-width: 0;
        }

        .cart-item-title {
            font-weight: 700;
            font-size: 0.92rem;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cart-item-sub {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .cart-item-price {
            font-weight: 800;
            color: #4ade80;
            font-size: 0.88rem;
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-qty {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-card);
            color: #fff;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            display: grid;
            place-items: center;
        }

        .cart-item-qty {
            font-weight: 700;
            font-size: 0.9rem;
            min-width: 20px;
            text-align: center;
        }

        .btn-item-delete {
            background: transparent;
            border: none;
            color: #ef4444;
            cursor: pointer;
            padding: 6px;
            font-size: 1.15rem;
            margin-left: 2px;
        }

        /* FOOTER DEL CARRITO */
        .cart-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border-card);
            background: #101622;
        }

        .cart-total-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .cart-total-label {
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .cart-total-amount {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.9rem;
            letter-spacing: 1px;
            color: #4ade80;
        }

        .cart-actions {
            display: flex;
            gap: 10px;
        }

        .btn-cart-checkout {
            flex: 2;
            background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
            color: #fff;
            border: none;
            padding: 13px 10px;
            border-radius: 12px;
            font-family: inherit;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(37, 211, 102, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-cart-checkout:hover {
            box-shadow: 0 6px 18px rgba(37, 211, 102, 0.6);
            transform: translateY(-1px);
        }

        .btn-cart-clear {
            flex: 1;
            background: rgba(239, 68, 68, 0.12);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 13px 10px;
            border-radius: 12px;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
        }

        /* ================================================= */
        /* MODAL VISOR EN ALTA RESOLUCIÓN                   */
        /* ================================================= */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(4, 7, 13, 0.88);
            backdrop-filter: blur(12px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 16px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-container {
            background: #141b29;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 20px;
            max-width: 400px;
            width: 100%;
            position: relative;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: modalPop 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes modalPop {
            from { transform: scale(0.92) translateY(15px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        .modal-close {
            position: absolute;
            top: 14px;
            right: 14px;
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: grid;
            place-items: center;
        }

        .modal-crop-viewer {
            width: 240px;
            aspect-ratio: 245 / 325;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
            margin: 8px 0 16px;
            background: #0b0e14;
        }

        .modal-crop-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .modal-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2rem;
            letter-spacing: 1px;
            color: #fff;
        }

        .modal-subtitle {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 14px;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .btn-modal {
            flex: 1;
            padding: 10px 12px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.82rem;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            text-decoration: none;
        }

        .btn-modal.prev-next {
            background: #1e293b;
            color: #fff;
            border: 1px solid var(--border-card);
        }

        .btn-modal.add {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="header-text">
                <h1 class="header-title">CARTAS COLECCIONABLES</h1>
                <p class="header-subtitle">Catálogo Oficial • 45 Cartas Disponibles</p>
            </div>
            <button class="btn-cart-toggle" onclick="abrirCarrito()">
                🛒 <span class="cart-btn-label">Carrito</span> <span class="cart-badge" id="cartBadgeCount">0</span>
            </button>
        </div>
    </header>

    <div class="controls-container">
        <div class="filter-buttons">
            <button class="btn-filter active" onclick="filtrarLamina('todas', this)">Todas (45)</button>
            <button class="btn-filter" onclick="filtrarLamina(1, this)">Lámina 1 (#01-#09)</button>
            <button class="btn-filter" onclick="filtrarLamina(2, this)">Lámina 2 (#10-#18)</button>
            <button class="btn-filter" onclick="filtrarLamina(3, this)">Lámina 3 (#19-#27)</button>
            <button class="btn-filter" onclick="filtrarLamina(4, this)">Lámina 4 (#28-#36)</button>
            <button class="btn-filter" onclick="filtrarLamina(5, this)">Lámina 5 (#37-#45)</button>
        </div>

        <div class="search-box">
            <svg viewBox="0 0 24 24"><path d="M10 18a7.952 7.952 0 0 0 4.897-1.688l4.396 4.396 1.414-1.414-4.396-4.396A7.952 7.952 0 0 0 18 10c0-4.411-3.589-8-8-8s-8 3.589-8 8 3.589 8 8 8zm0-14c3.309 0 6 2.691 6 6s-2.691 6-6 6-6-2.691-6-6 2.691-6 6-6z"/></svg>
            <input type="text" id="searchInput" placeholder="Buscar por # o lámina..." oninput="buscarFiguritas()">
        </div>
    </div>

    <div class="stats-bar">
        <div class="stat-item">Cartas visibles: <strong id="countVisibles">45</strong> / 45</div>
        <div class="stat-item">Precio: <strong style="color: #4ade80;">$ 500 c/u</strong></div>
    </div>

    <!-- GRID DE CARTAS (NO SE QUITAN AL COMPRAR) -->
    <main class="cards-grid" id="cardsGrid"></main>

    <!-- PANEL LATERAL DE CARRITO DE COMPRAS -->
    <div class="cart-overlay" id="cartOverlay" onclick="cerrarCarrito()"></div>
    <aside class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <div class="cart-title">
                🛒 MI CARRITO (<span id="cartTotalItemsCount">0</span>)
            </div>
            <button class="btn-close-cart" onclick="cerrarCarrito()">&times;</button>
        </div>

        <div class="cart-items-container" id="cartItemsContainer"></div>

        <div class="cart-footer">
            <div class="cart-total-row">
                <span class="cart-total-label">Total a pagar:</span>
                <span class="cart-total-amount" id="cartTotalAmount">$ 0</span>
            </div>
            <div class="cart-actions">
                <button class="btn-cart-clear" onclick="vaciarCarrito()">Vaciar</button>
                <button class="btn-cart-checkout" onclick="comprarPorWhatsApp()">
                    💬 Comprar Ahora
                </button>
            </div>
        </div>
    </aside>

    <!-- MODAL DETALLE / VISOR INDIVIDUAL -->
    <div class="modal-overlay" id="modalOverlay" onclick="cerrarModal(event)">
        <div class="modal-container" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="cerrarModal()">&times;</button>
            <div class="modal-title" id="modalTitle">CARTA #01</div>
            <div class="modal-subtitle" id="modalSubtitle">Lámina 01.jpg • Fila 1, Columna 1</div>
            
            <div class="modal-crop-viewer">
                <img class="modal-crop-image" id="modalCropImage" src="" alt="Carta">
            </div>

            <div class="modal-actions">
                <button class="btn-modal prev-next" onclick="navegarModal(-1)">◀ Anterior</button>
                <button class="btn-modal add" onclick="agregarAlCarrito(currentModalId); abrirCarrito();">🛒 Agregar • $ 500</button>
                <button class="btn-modal prev-next" onclick="navegarModal(1)">Siguiente ▶</button>
            </div>
        </div>
    </div>

    <script>
        const PRECIO_CARTA = 500;
        // Número de WhatsApp receptor: 11-6606-9613 (+54 9 11 6606-9613)
        const WHATSAPP_NUMERO = "5491166069613";

        // Configuración de recortes de láminas
        const laminasConfig = {
            1: { file: '01.jpg', xCols: [[42, 248], [263, 470], [485, 692]], yRows: [[190, 475], [485, 770], [780, 1065]] },
            2: { file: '02.jpg', xCols: [[35, 245], [260, 470], [485, 695]], yRows: [[185, 470], [480, 765], [775, 1060]] },
            3: { file: '03.jpg', xCols: [[45, 255], [265, 475], [485, 695]], yRows: [[175, 460], [470, 755], [765, 1050]] },
            4: { file: '04.jpg', xCols: [[30, 240], [250, 460], [470, 680]], yRows: [[150, 435], [445, 730], [740, 1025]] },
            5: { file: '05.jpg', xCols: [[40, 250], [260, 470], [480, 690]], yRows: [[195, 480], [490, 775], [785, 1070]] }
        };

        const figuritas = [];
        let idGlobal = 1;

        for (let numLamina = 1; numLamina <= 5; numLamina++) {
            const cfg = laminasConfig[numLamina];
            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 3; col++) {
                    const idStr = String(idGlobal).padStart(2, '0');
                    figuritas.push({
                        id: idGlobal,
                        idStr: idStr,
                        numLamina: numLamina,
                        file: cfg.file,
                        row: row + 1,
                        col: col + 1,
                        price: PRECIO_CARTA,
                        imgPath: `cartas2/carta_${idStr}.png`,
                        coords: {
                            x: cfg.xCols[col][0],
                            y: cfg.yRows[row][0],
                            w: cfg.xCols[col][1] - cfg.xCols[col][0],
                            h: cfg.yRows[row][1] - cfg.yRows[row][0]
                        }
                    });
                    idGlobal++;
                }
            }
        }

        // Carrito en localStorage
        let carrito = JSON.parse(localStorage.getItem('cart_stickers') || '{}');
        let currentModalId = 1;
        const grid = document.getElementById('cardsGrid');

        function renderizarFiguritas(lista) {
            grid.innerHTML = '';
            document.getElementById('countVisibles').textContent = lista.length;

            lista.forEach(fig => {
                const qtyInCart = carrito[fig.id] || 0;
                const isInCart = qtyInCart > 0;

                const card = document.createElement('div');
                card.className = `sticker-card ${isInCart ? 'in-cart' : ''}`;
                card.id = `card-${fig.id}`;
                card.onclick = () => abrirModal(fig.id);

                card.innerHTML = `
                    <div class="in-cart-indicator" id="indicator-${fig.id}">
                        ✓ En carrito (${qtyInCart})
                    </div>
                    <div class="crop-viewport">
                        <img 
                            class="crop-image" 
                            src="${fig.imgPath}" 
                            alt="Carta #${fig.idStr}" 
                            loading="lazy"
                            onerror="fallbackCanvasCrop(this, ${fig.id})"
                        />
                    </div>
                    <div class="card-info">
                        <span class="card-number">#${fig.idStr}</span>
                        <span class="card-sheet">Lámina ${fig.numLamina}</span>
                    </div>
                    <button class="btn-add-cart" onclick="btnAgregarClick(event, ${fig.id})">
                        <span>+ Agregar</span>
                        <span class="price-tag">$ ${fig.price}</span>
                    </button>
                `;

                grid.appendChild(card);
            });

            actualizarCarritoUI();
        }

        function fallbackCanvasCrop(imgEl, id) {
            const fig = figuritas.find(f => f.id === id);
            if (!fig) return;

            const baseImg = new Image();
            baseImg.src = fig.file;
            baseImg.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = fig.coords.w;
                canvas.height = fig.coords.h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(
                    baseImg,
                    fig.coords.x, fig.coords.y, fig.coords.w, fig.coords.h,
                    0, 0, fig.coords.w, fig.coords.h
                );
                imgEl.src = canvas.toDataURL('image/png');
            };
        }

        function btnAgregarClick(event, id) {
            event.stopPropagation();
            agregarAlCarrito(id);
        }

        function agregarAlCarrito(id) {
            carrito[id] = (carrito[id] || 0) + 1;
            guardarCarrito();
            actualizarCardIndicator(id);
            actualizarCarritoUI();
        }

        function modificarCantidad(id, delta) {
            if (!carrito[id]) return;
            carrito[id] += delta;
            if (carrito[id] <= 0) {
                delete carrito[id];
            }
            guardarCarrito();
            actualizarCardIndicator(id);
            actualizarCarritoUI();
        }

        function eliminarDelCarrito(id) {
            delete carrito[id];
            guardarCarrito();
            actualizarCardIndicator(id);
            actualizarCarritoUI();
        }

        function vaciarCarrito() {
            if (Object.keys(carrito).length === 0) return;
            if (confirm("¿Deseas vaciar todas las cartas del carrito?")) {
                carrito = {};
                guardarCarrito();
                document.querySelectorAll('.sticker-card').forEach(c => c.classList.remove('in-cart'));
                document.querySelectorAll('.in-cart-indicator').forEach(i => i.style.display = 'none');
                actualizarCarritoUI();
            }
        }

        /* ENVÍO DEL PEDIDO A WHATSAPP */
        function comprarPorWhatsApp() {
            const ids = Object.keys(carrito).map(Number);
            if (ids.length === 0) {
                alert("El carrito está vacío. Agrega al menos una carta para realizar la compra.");
                return;
            }

            let totalCartas = 0;
            let totalPesos = 0;
            let lineasDetalle = [];

            // Ordenar por ID de carta
            ids.sort((a, b) => a - b).forEach(id => {
                const fig = figuritas.find(f => f.id === id);
                if (!fig) return;
                const qty = carrito[id];
                const subtotal = qty * PRECIO_CARTA;
                totalCartas += qty;
                totalPesos += subtotal;

                lineasDetalle.push(`• Carta #${fig.idStr} (Lámina ${fig.numLamina}) x${qty} = $ ${subtotal.toLocaleString('es-AR')}`);
            });

            // Armar texto del mensaje
            const fechaStr = new Date().toLocaleDateString('es-AR', {
                day: '2-digit', month: '2-digit', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });

            const mensaje = 
`*¡Hola! Quiero comprar las siguientes Cartas Coleccionables:*

${lineasDetalle.join('\n')}

━━━━━━━━━━━━━━━━━━━━
*Total de cartas:* ${totalCartas}
*Monto Total:* $ ${totalPesos.toLocaleString('es-AR')}
━━━━━━━━━━━━━━━━━━━━
_Fecha pedido: ${fechaStr}_

¿Me confirmas disponibilidad y medios de pago? ¡Muchas gracias!`;

            // Enlace de WhatsApp
            const urlWhatsApp = `https://api.whatsapp.com/send?phone=${WHATSAPP_NUMERO}&text=${encodeURIComponent(mensaje)}`;

            // Abrir en nueva pestaña / app de WhatsApp
            window.open(urlWhatsApp, '_blank');
        }

        function guardarCarrito() {
            localStorage.setItem('cart_stickers', JSON.stringify(carrito));
        }

        function actualizarCardIndicator(id) {
            const card = document.getElementById(`card-${id}`);
            const indicator = document.getElementById(`indicator-${id}`);
            const qty = carrito[id] || 0;
            if (card && indicator) {
                if (qty > 0) {
                    card.classList.add('in-cart');
                    indicator.textContent = `✓ En carrito (${qty})`;
                    indicator.style.display = 'block';
                } else {
                    card.classList.remove('in-cart');
                    indicator.style.display = 'none';
                }
            }
        }

        function actualizarCarritoUI() {
            const container = document.getElementById('cartItemsContainer');
            const totalAmountEl = document.getElementById('cartTotalAmount');
            const badgeEl = document.getElementById('cartBadgeCount');
            const totalItemsHeader = document.getElementById('cartTotalItemsCount');

            const ids = Object.keys(carrito).map(Number);
            let totalCartas = 0;
            let totalPesos = 0;

            container.innerHTML = '';

            if (ids.length === 0) {
                container.innerHTML = `
                    <div class="cart-empty-message">
                        <div class="cart-empty-icon">🛒</div>
                        <p>Tu carrito está vacío.</p>
                        <p style="font-size: 0.8rem; margin-top: 6px;">Toca en <strong>+ Agregar</strong> en las cartas que desees comprar.</p>
                    </div>
                `;
            } else {
                ids.sort((a, b) => a - b).forEach(id => {
                    const fig = figuritas.find(f => f.id === id);
                    if (!fig) return;
                    const qty = carrito[id];
                    const subtotal = qty * PRECIO_CARTA;

                    totalCartas += qty;
                    totalPesos += subtotal;

                    const item = document.createElement('div');
                    item.className = 'cart-item';
                    item.innerHTML = `
                        <div class="cart-item-thumb">
                            <img src="${fig.imgPath}" alt="Carta #${fig.idStr}">
                        </div>
                        <div class="cart-item-info">
                            <div class="cart-item-title">Carta #${fig.idStr}</div>
                            <div class="cart-item-sub">Lámina ${fig.numLamina} • $ ${PRECIO_CARTA} c/u</div>
                            <div class="cart-item-price">$ ${subtotal.toLocaleString('es-AR')}</div>
                        </div>
                        <div class="cart-item-controls">
                            <button class="btn-qty" onclick="modificarCantidad(${fig.id}, -1)">−</button>
                            <span class="cart-item-qty">${qty}</span>
                            <button class="btn-qty" onclick="modificarCantidad(${fig.id}, 1)">+</button>
                            <button class="btn-item-delete" onclick="eliminarDelCarrito(${fig.id})" title="Quitar">🗑</button>
                        </div>
                    `;
                    container.appendChild(item);
                });
            }

            badgeEl.textContent = totalCartas;
            totalItemsHeader.textContent = totalCartas;
            totalAmountEl.textContent = `$ ${totalPesos.toLocaleString('es-AR')}`;
        }

        function abrirCarrito() {
            document.getElementById('cartOverlay').classList.add('active');
            document.getElementById('cartDrawer').classList.add('active');
        }

        function cerrarCarrito() {
            document.getElementById('cartOverlay').classList.remove('active');
            document.getElementById('cartDrawer').classList.remove('active');
        }

        // Filtro por Lámina
        let filtroLaminaActual = 'todas';
        function filtrarLamina(numLamina, btn) {
            filtroLaminaActual = numLamina;
            document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            aplicarFiltros();
        }

        // Buscador
        function buscarFiguritas() {
            aplicarFiltros();
        }

        function aplicarFiltros() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            let filtrados = figuritas;

            if (filtroLaminaActual !== 'todas') {
                filtrados = filtrados.filter(f => f.numLamina === filtroLaminaActual);
            }

            if (query) {
                filtrados = filtrados.filter(f => {
                    const matchId = String(f.id).includes(query.replace('#', '')) || f.idStr.includes(query);
                    const matchSheet = `lamina ${f.numLamina}`.includes(query) || f.file.toLowerCase().includes(query);
                    return matchId || matchSheet;
                });
            }

            renderizarFiguritas(filtrados);
        }

        // MODAL DETALLE
        function abrirModal(id) {
            currentModalId = id;
            const fig = figuritas.find(f => f.id === id);
            if (!fig) return;

            document.getElementById('modalTitle').textContent = `CARTA #${fig.idStr}`;
            document.getElementById('modalSubtitle').textContent = `Lámina ${fig.file} • Fila ${fig.row}, Columna ${fig.col}`;

            const imgEl = document.getElementById('modalCropImage');
            imgEl.src = fig.imgPath;
            imgEl.onerror = () => fallbackCanvasCrop(imgEl, fig.id);

            document.getElementById('modalOverlay').classList.add('active');
        }

        function cerrarModal(e) {
            if (e && e.target !== document.getElementById('modalOverlay') && !e.target.classList.contains('modal-close')) return;
            document.getElementById('modalOverlay').classList.remove('active');
        }

        function navegarModal(delta) {
            let nuevoId = currentModalId + delta;
            if (nuevoId < 1) nuevoId = 45;
            if (nuevoId > 45) nuevoId = 1;
            abrirModal(nuevoId);
        }

        // Teclado (ESC y Flechas)
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                cerrarModal();
                cerrarCarrito();
            }
            const modal = document.getElementById('modalOverlay');
            if (modal.classList.contains('active')) {
                if (e.key === 'ArrowLeft') navegarModal(-1);
                if (e.key === 'ArrowRight') navegarModal(1);
            }
        });

        // Inicializar
        renderizarFiguritas(figuritas);
    </script>
</body>
</html>
